name: Build and Push Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCPWIF }}
          service_account: ${{ secrets.GCPSERVICEACCOUNT }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker asia-south2-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/YOUR_REPOSITORY/YOUR_IMAGE:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/YOUR_REPOSITORY/YOUR_IMAGE:${{ github.sha }}
